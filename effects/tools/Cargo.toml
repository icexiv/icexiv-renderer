[package]
name = "icexiv-action-import"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "icexiv-action"
path = "import_action.rs"
required-features = ["data-snapshot"]

[features]
default = ["data-snapshot", "pack"]
data-snapshot = []
pack = ["icexiv-data/local", "dep:tokio", "dep:sha2"]

[dependencies]
icexiv-data = { git = "https://github.com/icexiv/icexiv-data.git", rev = "c365a807a6bcf48b2696823d2145acce26500074" }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
