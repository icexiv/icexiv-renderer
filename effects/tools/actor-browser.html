<!doctype html><meta charset="utf-8"><title>Dressed actor + weapon acceptance</title>
<link rel="icon" href="data:,"><icexiv-equipment-canvas></icexiv-equipment-canvas>
<!-- Serve with the built package at ./sdk/. Use export_actor to create actor.json
     and objects/. The weapon fixture is generated by effects/tests/actor.rs. -->
<script type="module">
import "./sdk/component.js";
const canvas=document.querySelector("icexiv-equipment-canvas"),errors=[];
canvas.addEventListener("rendererror",e=>errors.push(String(e.detail)));
const response=async path=>{const r=await fetch(path);if(!r.ok)throw Error(path+": "+r.status);return r};
const bytes=async path=>new Uint8Array(await (await response(path)).arrayBuffer());
window.ready=(async()=>{
  const weapon=await (await response("weapon.json")).json();
  await canvas.openEffect(weapon,(_,id)=>bytes(`weapon/${id}`));
  const manifest=await (await response("actor.json")).json();
  const play=()=>canvas.setActorBundle(manifest,async(_,h)=>{
    const b=await bytes(`objects/${h.slice(0,2)}/${h.slice(2)}`);
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",b)),v=>v.toString(16).padStart(2,"0")).join("");
    if(digest!==h)throw Error("actor CAS digest mismatch");
    return b;
  });
  await play();
  await new Promise(r=>setTimeout(r,400));
  await canvas.clearActor();
  await play();
  if(new URLSearchParams(location.search).has("partial")){
    const rigs=await canvas.actorPartialRigs(), face=rigs.find(p=>p.includes("/face/")),hair=rigs.find(p=>p.includes("/hair/"));
    if(!face||!hair)throw Error("missing auxiliary rig");
    const {names,rest}=await canvas.actorPartialSkeleton(face), jaw=names.indexOf("j_f_ago");
    if(jaw<0)throw Error("no facial jaw");
    rest[jaw*10+1]+=0.06;
    await canvas.setActorPartialPose(face,rest);
    await canvas.clearActorPartial(face);
    const duration=await canvas.setActorPartialClip(face,await bytes("face.pap"),"cfxb_blink1");
    if(Math.abs(duration-0.26666668)>0.0001)throw Error("wrong named blink");
  }
  await new Promise(r=>setTimeout(r,400));
  if(errors.length)throw Error(errors.join("; "));
})();
</script>
