[package]
name = "xiv-companion-render"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
renderer = ["dep:bytemuck", "dep:glam", "dep:half", "dep:wgpu", "dep:wesl"]
test-support = ["renderer", "dep:image", "dep:pollster"]

[build-dependencies]
wesl = { version = "0.4", default-features = false, optional = true }

[dependencies]
bytemuck = { version = "1.22", features = ["derive"], optional = true }
glam = { version = "0.30", optional = true }
half = { version = "2.7.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "29", optional = true }
xiv-companion-data = { package = "icexiv-data", git = "https://github.com/icexiv/icexiv-data.git", rev = "7fa1b24b9cac1b9892e8f6cdf290eb857fc9c08d", default-features = false }

[dev-dependencies]
serde_json = "1.0.148"
