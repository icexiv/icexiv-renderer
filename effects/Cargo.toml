[package]
name = "icexiv-effects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
gpu-tests = ["scene/test-support"]

[dependencies]
anyhow = "1"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The effect player and its asset types must come from matching revisions.
scene = { package = "xiv-companion-render", path = "scene", features = ["renderer"] }
assets = { package = "icexiv-data", git = "https://github.com/icexiv/icexiv-data.git", rev = "7fa1b24b9cac1b9892e8f6cdf290eb857fc9c08d", features = ["game-data"] }
physis = { git = "https://github.com/redstrate/Physis.git", rev = "3f1f6534644e1cbbb40c8338856f394450b243bd" }
wgpu = "29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "console"] }

[dev-dependencies]
png = "0.17"
pollster = "0.4"
sha2 = "0.10"
