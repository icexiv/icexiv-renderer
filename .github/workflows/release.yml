name: Build and release renderer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-update-lock-file --max-jobs 1 --cores 2
      - run: nix build --no-update-lock-file .#sdk --out-link result-sdk
      - name: Package the static JS, WASM and TypeScript SDK
        run: |
          mkdir dist
          npm pack ./result-sdk --pack-destination dist
          mv dist/*.tgz dist/icexiv-renderer-web.tgz
          (cd dist && sha256sum icexiv-renderer-web.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-web
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renderer-web
          path: dist
      - name: Update rolling main release tag
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const ref = 'tags/dev-build';
            try {
              await github.rest.git.updateRef({...repo, ref, sha: context.sha, force: true});
            } catch (e) {
              if (e.status !== 422 && e.status !== 404) throw e;
              await github.rest.git.createRef({...repo, ref: `refs/${ref}`, sha: context.sha});
            }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && 'true' || 'false' }}
          body: |
            Web SDK (ES module, WASM, TypeScript). Source commit: `${{ github.sha }}`.
            Native Rust hosts depend on the crate at the same commit.
          files: dist/*
          fail_on_unmatched_files: true
